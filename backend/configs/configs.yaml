  confidence: 0.3
  iou: 0.4
  vehicle_class_ids: [0, 1, 2, 3, 5, 7] # bicycle, car, motorcycle, bus, truck
  device: cpu # cpu/cuda

tracker_config:
  max_disappeared: 10
  max_distance: 80

video_path: "data/videos/traffic.mp4"
experiment_name: "det_c025_i04"
