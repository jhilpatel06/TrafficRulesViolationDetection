# backend/configs/configs.yaml

lane_directions:
  frame_width: 1280
  frame_height: 720

  lanes:
  - id: right
    polygon:
    - [79, 1070]
    - [493, 404]
    - [748, 0]
    - [981, 4]
    - [1261, 202]
    - [1908, 744]
    - [1908, 1065]
    direction: [0, -1]   # upward direction

  - id: left
    polygon:
    - [6, 1068]
    - [70, 1063]
    - [740, 1]
    - [546, 0]
    - [4, 277]
    direction: [0, 1]   # downward direction

wrong_way_detector_config: # dictionary of items
  history_window: 7
  min_displacement: 7
  direction_threshold: 0
  required_consecutive_frames: 3

