# backend/configs/configs.yaml

lane_directions:
  frame_width: 1280
  frame_height: 720

  lanes:
  - id: right
    polygon:
    - [79, 1070]   # Bottom left
    - [493, 404]   # Mid-left
    - [748, 0]     # Top left
    - [981, 4]     # Top right
    - [1261, 202]  # Mid-right
    - [1908, 700]  # Bottom right corner (upper part)
    - [1908, 1065] # Bottom right corner (lower part)
    
    direction: [0, -1]   # upward direction

  - id: left
    polygon:
    - [6, 1068]
    - [70, 1063]
    - [740, 1]
    - [520, 0]
    - [4, 220]
    direction: [0, 1]   # downward direction

wrong_way_detector_config: # dictionary of items
  history_window: 5
  min_displacement: 0.5
  direction_threshold: -0.4
  required_consecutive_frames: 2

detector_config:
  confidence: 0.1
  iou: 0.6
  imgsz: 1280 
  frame_skip: 3 
  vehicle_class_ids: [0, 1, 2, 3, 5, 7] # person, bicycle, car, motorcycle, bus, truck
  device: cpu # cpu/cuda

tracker_config:
  track_activation_threshold: 0.1
  lost_track_buffer: 30
  minimum_matching_threshold: 0.4
  frame_rate: 30

video_path: "data/videos/traffic.mp4"
experiment_name: "ww5_05_n04_2_sk3"
save_result: yes   # yes/no